<g fill="#1b1f24">
<text x="80" y="205" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="12">máquina</text><text x="80" y="221" text-anchor="middle" fill="#c0392b" font-weight="700" font-size="12">com falha</text><polygon points="80,165 88,180 72,180" fill="#e08a00"/><line x1="225" y1="172" x2="225" y2="246" stroke="#c0392b" stroke-width="2" marker-start="url(#sv)" marker-end="url(#sv)"/><text x="232" y="214" text-anchor="start" fill="#c0392b" font-weight="700" font-size="12">tensão de</text><text x="232" y="229" text-anchor="start" fill="#c0392b" font-weight="700" font-size="12">toque</text><text x="150" y="290" text-anchor="middle" fill="#1b1f24" font-weight="400" font-size="12">Mão na carcaça energizada, pés no chão.</text><line x1="558" y1="262" x2="622" y2="262" stroke="#c0392b" stroke-width="2" marker-start="url(#sv)" marker-end="url(#sv)"/><text x="590" y="282" text-anchor="middle" fill="#c0392b" font-weight="700" font-size="12">tensão de passo</text><text x="470" y="108" text-anchor="middle" fill="#c0392b" font-weight="700" font-size="12">cabo caído</text><text x="470" y="310" text-anchor="middle" fill="#1b1f24" font-weight="400" font-size="12">A tensão no solo cai com a distância.</text><text x="470" y="326" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="12">Afaste-se com passos curtos, pés juntos.</text>
