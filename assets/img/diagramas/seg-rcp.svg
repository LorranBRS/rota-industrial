<text x="175" y="330" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="12">mãos sobrepostas no centro do peito</text><text x="175" y="346" text-anchor="middle" fill="#5b6470" font-weight="400" font-size="12">(metade inferior do esterno)</text><rect x="330" y="60" width="300" height="48" rx="8" fill="#fff" stroke="#cfd5dd" stroke-width="1.5"/><text x="345" y="81" text-anchor="start" fill="#c0392b" font-weight="800" font-size="14">100 a 120</text><text x="345" y="98" text-anchor="start" fill="#5b6470" font-weight="400" font-size="12">compressões por minuto</text><rect x="330" y="118" width="300" height="48" rx="8" fill="#fff" stroke="#cfd5dd" stroke-width="1.5"/><text x="345" y="139" text-anchor="start" fill="#c0392b" font-weight="800" font-size="14">5 a 6 cm</text><text x="345" y="156" text-anchor="start" fill="#5b6470" font-weight="400" font-size="12">de profundidade (adulto)</text><rect x="330" y="176" width="300" height="48" rx="8" fill="#fff" stroke="#cfd5dd" stroke-width="1.5"/><text x="345" y="197" text-anchor="start" fill="#1b1f24" font-weight="800" font-size="14">Deixe o peito voltar</text><text x="345" y="214" text-anchor="start" fill="#5b6470" font-weight="400" font-size="12">entre uma compressão e outra</text><rect x="330" y="234" width="300" height="48" rx="8" fill="#fff" stroke="#cfd5dd" stroke-width="1.5"/><text x="345" y="255" text-anchor="start" fill="#1b1f24" font-weight="800" font-size="14">30 : 2</text><text x="345" y="272" text-anchor="start" fill="#5b6470" font-weight="400" font-size="12">se treinado; senão, só compressões</text><rect x="330" y="292" width="300" height="48" rx="8" fill="#fff" stroke="#cfd5dd" stroke-width="1.5"/><text x="345" y="313" text-anchor="start" fill="#1b1f24" font-weight="800" font-size="14">Peça o DEA</text><text x="345" y="330" text-anchor="start" fill="#5b6470" font-weight="400" font-size="12">e use assim que chegar</text><text x="330" y="30" text-anchor="start" fill="#1f5fa8" font-weight="800" font-size="14">Ligue 192 (SAMU) antes de começar</text>
