<text x="240" y="285" text-anchor="middle" fill="#1f5fa8" font-weight="700" font-size="13">P = potência ativa (kW) — faz trabalho</text><text x="432" y="100" text-anchor="start" fill="#e08a00" font-weight="700" font-size="13">Q = reativa (kvar)</text><text x="432" y="118" text-anchor="start" fill="#5b6470" font-weight="400" font-size="11">magnetiza motores e reatores</text><text x="200" y="150" text-anchor="end" fill="#c0392b" font-weight="700" font-size="13">S = aparente (kVA)</text><text x="140" y="252" text-anchor="middle" fill="#1b1f24" font-weight="800" font-size="16">φ</text><text x="432" y="175" text-anchor="start" fill="#1f8a4c" font-weight="700" font-size="12">capacitores reduzem Q</text><text x="432" y="192" text-anchor="start" fill="#1f8a4c" font-weight="400" font-size="12">→ φ menor, cos φ maior</text><text x="300" y="330" text-anchor="middle" fill="#1b1f24" font-weight="800" font-size="15">cos φ = P ÷ S   ·   S² = P² + Q²</text>
