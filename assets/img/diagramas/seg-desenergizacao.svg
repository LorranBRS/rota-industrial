<rect x="20" y="40" width="200" height="90" rx="12" fill="#f6f7f9" stroke="#1b1f24" stroke-width="2"/><circle cx="120" cy="62" r="14" fill="#e08a00"/><text x="120" y="68" text-anchor="middle" fill="#fff" font-weight="800" font-size="14">1</text><text x="120" y="96" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="13">Seccionamento</text><text x="120" y="114" text-anchor="middle" fill="#5b6470" font-weight="400" font-size="12">abrir o circuito</text><line x1="224" y1="85" x2="240" y2="85" stroke="#1f5fa8" stroke-width="2" marker-end="url(#sa)"/><rect x="245" y="40" width="200" height="90" rx="12" fill="#f6f7f9" stroke="#1b1f24" stroke-width="2"/><circle cx="345" cy="62" r="14" fill="#e08a00"/><text x="345" y="68" text-anchor="middle" fill="#fff" font-weight="800" font-size="14">2</text><text x="345" y="96" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="13">Impedimento de</text><text x="345" y="114" text-anchor="middle" fill="#5b6470" font-weight="400" font-size="12">reenergização (bloqueio)</text><line x1="449" y1="85" x2="465" y2="85" stroke="#1f5fa8" stroke-width="2" marker-end="url(#sa)"/><rect x="470" y="40" width="200" height="90" rx="12" fill="#f6f7f9" stroke="#1b1f24" stroke-width="2"/><circle cx="570" cy="62" r="14" fill="#e08a00"/><text x="570" y="68" text-anchor="middle" fill="#fff" font-weight="800" font-size="14">3</text><text x="570" y="96" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="13">Constatação da</text><text x="570" y="114" text-anchor="middle" fill="#5b6470" font-weight="400" font-size="12">ausência de tensão</text><rect x="20" y="170" width="200" height="90" rx="12" fill="#f6f7f9" stroke="#1b1f24" stroke-width="2"/><circle cx="120" cy="192" r="14" fill="#e08a00"/><text x="120" y="198" text-anchor="middle" fill="#fff" font-weight="800" font-size="14">4</text><text x="120" y="226" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="13">Aterramento temporário</text><text x="120" y="244" text-anchor="middle" fill="#5b6470" font-weight="400" font-size="12">com equipotencialização</text><line x1="224" y1="215" x2="240" y2="215" stroke="#1f5fa8" stroke-width="2" marker-end="url(#sa)"/><rect x="245" y="170" width="200" height="90" rx="12" fill="#f6f7f9" stroke="#1b1f24" stroke-width="2"/><circle cx="345" cy="192" r="14" fill="#e08a00"/><text x="345" y="198" text-anchor="middle" fill="#fff" font-weight="800" font-size="14">5</text><text x="345" y="226" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="13">Proteção dos elementos</text><text x="345" y="244" text-anchor="middle" fill="#5b6470" font-weight="400" font-size="12">energizados próximos</text><line x1="449" y1="215" x2="465" y2="215" stroke="#1f5fa8" stroke-width="2" marker-end="url(#sa)"/><rect x="470" y="170" width="200" height="90" rx="12" fill="#f6f7f9" stroke="#1b1f24" stroke-width="2"/><circle cx="570" cy="192" r="14" fill="#e08a00"/><text x="570" y="198" text-anchor="middle" fill="#fff" font-weight="800" font-size="14">6</text><text x="570" y="226" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="13">Sinalização de</text><text x="570" y="244" text-anchor="middle" fill="#5b6470" font-weight="400" font-size="12">impedimento de religação</text><path d="M 570 130 L 570 150 L 120 150 L 120 166" fill="none" stroke="#1f5fa8" stroke-width="2" marker-end="url(#sa)"/><text x="345" y="285" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="13">Só depois dos 6 passos a instalação é considerada desenergizada (NR-10, item 10.5.1).</text>
