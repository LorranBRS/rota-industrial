<rect x="40.0" y="70" width="83.9" height="44" fill="#d9f2e3"/><rect x="123.9" y="70" width="156.1" height="44" fill="#a8dcbc"/><rect x="280.0" y="70" width="57.3" height="44" fill="#ffd591"/><rect x="337.3" y="70" width="182.7" height="44" fill="#f4a29a"/><rect x="520.0" y="70" width="120.0" height="44" fill="#c0392b"/><text x="123.87640052032226" y="138" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="12">0,5 mA</text><text x="280.0" y="138" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="12">10 mA</text><text x="337.2545505663595" y="138" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="12">30 mA</text><text x="520.0" y="138" text-anchor="middle" fill="#1b1f24" font-weight="700" font-size="12">1.000 mA</text><text x="81.09072169866474" y="175" text-anchor="middle" fill="#1b1f24" font-weight="600" font-size="12">não sente</text><text x="201.09072169866474" y="200" text-anchor="middle" fill="#1b1f24" font-weight="600" font-size="12">formigamento, susto</text><text x="307.6538705653929" y="225" text-anchor="middle" fill="#1b1f24" font-weight="600" font-size="12">contração muscular: pode não conseguir largar</text><text x="427.6538705653929" y="250" text-anchor="middle" fill="#1b1f24" font-weight="600" font-size="12">risco de fibrilação ventricular</text><text x="594.6179973983888" y="275" text-anchor="end" fill="#1b1f24" font-weight="600" font-size="12">queimaduras graves, parada</text><text x="337.2545505663595" y="24" text-anchor="middle" fill="#1f5fa8" font-weight="800" font-size="13">DR de 30 mA: desliga antes da faixa de fibrilação</text><text x="340" y="310" text-anchor="middle" fill="#5b6470" font-weight="400" font-size="12">Valores aproximados, corrente alternada 60 Hz, adulto. O tempo de passagem também conta.</text>
